name: Daily Market & News Alert

on:
  schedule:
    # காலை 7:00 AM IST (1:30 AM UTC)
    - cron: '30 1 * * *'
    # இரவு 8:00 PM IST (2:30 PM UTC)
    - cron: '30 14 * * *'
  # எப்போது வேண்டுமானாலும் மேனுவலாக டெஸ்ட் செய்து பார்க்க:
  workflow_dispatch:

jobs:
  send-alert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests pytz

      - name: Run Telegram Bot Script
        env:
          BOT_TOKEN: ${{ secrets.8844114153:AAH2ckVvRNm42bkbo0_c2oipsUjuauL4wr4 }}
          CHAT_ID: ${{ secrets.6114756103 }}
        run: python main.py
